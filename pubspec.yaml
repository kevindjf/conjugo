name: conjugo
description: Application Flutter ludique pour travailler les verbes du 1er groupe au présent.
publish_to: "none" # empêche la publication accidentelle

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Pour la police et l'UI ludique
  google_fonts: ^6.1.0

  # Nécessaire pour les animations ou transitions douces
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/data/verbs.json
